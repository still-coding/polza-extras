[project]
name = "polza-extras"
version = "0.1.0"
description = "Polza.ai helpers on top of the OpenAI SDK: ruble cost, typed errors, retry rules, model catalog, balance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polza_extras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Polza API (needs POLZA_AI_API_KEY)"]
# Coverage is gated: plain `uv run pytest` (and CI) fails below fail_under.
# Live smoke tests cover little on purpose; run them with `--no-cov`.
addopts = "-m 'not live' --cov=polza_extras --cov-branch --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
