[project]
name = "polza-extras"
version = "0.1.0"
description = "Polza.ai helpers on top of the OpenAI SDK: ruble cost, typed errors, retry rules, model catalog, balance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "still-coding" }]
keywords = ["polza", "polza.ai", "openai", "llm", "russia", "rubles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/still-coding/polza-extras"
Issues = "https://github.com/still-coding/polza-extras/issues"
Changelog = "https://github.com/still-coding/polza-extras/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/polza_extras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Polza API (needs POLZA_AI_API_KEY)"]
# Coverage is gated: plain `uv run pytest` (and CI) fails below fail_under.
# Live smoke tests cover little on purpose; run them with `--no-cov`.
addopts = "-m 'not live' --cov=polza_extras --cov-branch --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 95

# ruff replaces flake8 (E, W, F + bugbear B), isort (I) and black (`ruff format`).
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]  # README examples keep their aligned comments

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["polza_extras", "tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
